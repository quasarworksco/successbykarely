# Genera las páginas estáticas del blog (vistas previas en WhatsApp/Facebook),
# sitemap.xml y blog/feed.xml. Se ejecuta a mano y cada 6 horas.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (JSON de una cuenta de servicio
# con rol "Cloud Datastore Viewer"). Ver README, sección "Blog estático".
name: Blog estático

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: blog-estatico
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del generador
        run: npm install --prefix scripts --no-audit --no-fund

      - name: Generar páginas, sitemap y RSS
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/generar-blog.mjs

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en el blog."
          else
            git commit -m "Blog: actualizar páginas estáticas, sitemap y RSS"
            git push
          fi
