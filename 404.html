<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página no encontrada | Success by Karely</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3A0E1D">
  <!-- La 404 puede servirse desde cualquier ruta: por eso usa rutas absolutas del dominio y estilos propios -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..600&family=Plus+Jakarta+Sans:wght@400..600&display=swap">
  <style>
    :root { --vino:#56172C; --vino-profundo:#3A0E1D; --vino-suave:#7A2A45; --oro-medio:#E4C692; --oro-claro:#F6DCB9;
      --degradado-oro: linear-gradient(115deg,#C99F66 0%,#E9CD98 38%,#F6DCB9 55%,#D8B47E 80%,#C99F66 100%); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--oro-claro); text-align: center;
      background: radial-gradient(90% 70% at 15% 0%, rgba(122,42,69,.9), transparent 60%),
                  radial-gradient(80% 60% at 90% 100%, rgba(211,174,122,.18), transparent 60%),
                  linear-gradient(160deg, var(--vino-profundo), var(--vino) 55%, var(--vino-profundo)); }
    .panel { max-width: 520px; padding: clamp(32px, 6vw, 56px); border-radius: 28px;
      background: rgba(255,252,250,.08); border: 1px solid rgba(246,220,185,.22);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 30px 60px -30px rgba(20,4,10,.6); }
    .k { font-family: 'Playfair Display', Georgia, serif; font-size: 5rem; line-height: 1; background: var(--degradado-oro);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--oro-medio); }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.4rem); color: #FFFCFA; margin: 16px 0 10px; }
    p { margin: 0 0 26px; line-height: 1.6; }
    a { display: inline-flex; align-items: center; min-height: 50px; padding: 0 28px; border-radius: 999px; font-weight: 500;
      text-decoration: none; color: var(--vino-profundo); background: var(--degradado-oro); }
    a:focus-visible { outline: 2px solid var(--oro-claro); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="panel">
    <img class="k" src="/assets/img/marca/monograma.webp" alt="" width="120" height="104" style="width:120px;height:auto;margin:0 auto 6px;display:block">
    <h1>Este camino no existe</h1>
    <p>Pero el tuyo sí. Vuelve al inicio y sigamos diseñando tu ruta.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
