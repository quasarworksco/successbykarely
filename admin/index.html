<!doctype html>
<html lang="es" data-tema="sistema">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel | Success by Karely</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3A0E1D">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png">
  <script>
    try { var t = localStorage.getItem('sbk-tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Plus+Jakarta+Sans:ital,wght@0,300..700;1,400&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script type="module" src="../assets/js/admin.js"></script>
</head>
<body class="admin">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-anillo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C99F66"/><stop offset=".45" stop-color="#E9CD98"/>
        <stop offset=".6" stop-color="#F6DCB9"/><stop offset="1" stop-color="#D8B47E"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ================= CARGA ================= -->
  <div class="carga-inicial" id="carga" role="status" aria-live="polite">
    <div class="carga-marca">
      <span class="carga-k" aria-hidden="true">K</span>
      <span class="carga-barra" aria-hidden="true"><span></span></span>
      <span class="solo-lectores">Cargando el panel…</span>
    </div>
  </div>

  <!-- ================= ACCESO ================= -->
  <section class="acceso seccion-oscura" id="acceso" hidden aria-labelledby="acceso-titulo">
    <div class="fondo-vivo activo" aria-hidden="true"><span class="orbe orbe-1"></span><span class="orbe orbe-2"></span><span class="orbe orbe-3"></span></div>
    <header class="acceso-cabecera">
      <a class="marca" href="../" aria-label="Success by Karely">
        <span class="monograma"><span class="k-tipografica" aria-hidden="true">K</span></span>
        <span class="marca-texto">Success <em>by</em> Karely</span>
      </a>
      <button class="btn-idioma" type="button" data-cambiar-idioma>EN</button>
    </header>
    <main class="acceso-centro">
      <div class="acceso-panel glass">
        <div class="acceso-encabezado">
          <h1 id="acceso-titulo" class="acceso-titulo" data-i18n="adm.accesoTitulo">Panel de administración</h1>
          <p class="acceso-sub" data-i18n="adm.accesoSub">Solo para el equipo de Success by Karely.</p>
        </div>
        <form id="form-acceso" class="formulario form-oscuro panel-acceso" novalidate style="margin-top:22px">
          <div class="campo">
            <label for="a-correo" data-i18n="acc.correo">Correo electrónico</label>
            <input id="a-correo" type="email" autocomplete="username" required>
          </div>
          <div class="campo">
            <label for="a-contrasena" data-i18n="acc.contrasena">Contraseña</label>
            <input id="a-contrasena" type="password" autocomplete="current-password" required>
          </div>
          <p class="error-general" id="error-acceso" role="alert"></p>
          <button type="submit" class="btn btn-principal btn-ancho" id="btn-acceso"><span data-i18n="adm.entrar">Entrar al panel</span></button>
          <a class="enlace-suave" href="../portal/" data-i18n="adm.irPortal">¿Eres cliente? Ve a tu espacio</a>
        </form>
      </div>
      <p class="acceso-pie"><span class="sello-6sgs"><span class="sello-punto" aria-hidden="true"></span><span data-i18n="acc.sello">Parte de 6SGS Consultants</span></span></p>
    </main>
  </section>

  <!-- ================= PANEL ================= -->
  <div class="app" id="app" hidden>
    <a class="saltar" href="#vista" data-i18n="nav.saltar">Saltar al contenido</a>
    <aside class="lateral" id="lateral" aria-label="Menú del panel">
      <div class="lateral-cabecera">
        <a class="marca" href="#resumen" aria-label="Resumen">
          <span class="monograma"><span class="k-tipografica" aria-hidden="true">K</span></span>
          <span class="marca-texto">Success <em>by</em> Karely</span>
        </a>
        <button class="btn-cerrar-lateral" type="button" id="cerrar-lateral" data-i18n-attr="aria-label:menu.cerrar" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="rol-actual" id="rol-actual"></p>
      <nav class="lateral-nav" id="menu-admin"></nav>
      <div class="lateral-pie">
        <div class="usuario-mini">
          <span class="avatar" id="admin-avatar" aria-hidden="true">K</span>
          <span class="usuario-mini-texto"><strong id="admin-nombre"></strong><span id="admin-correo"></span></span>
        </div>
        <a class="btn-salir" href="../" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>
          <span data-i18n="adm.verSitio">Ver el sitio</span>
        </a>
        <button type="button" class="btn-salir" id="btn-salir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
          <span data-i18n="menu.salir">Cerrar sesión</span>
        </button>
      </div>
    </aside>
    <div class="lateral-velo" id="velo" hidden></div>

    <div class="app-principal">
      <header class="barra-superior">
        <button type="button" class="btn-icono btn-abrir-lateral" id="abrir-lateral" aria-controls="lateral" aria-expanded="false" data-i18n-attr="aria-label:menu.abrir" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <h1 class="titulo-vista" id="titulo-vista" tabindex="-1"></h1>
        <div class="busqueda-global" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="solo-lectores" for="buscar-global" data-i18n="adm.buscar">Buscar</label>
          <input id="buscar-global" type="search" autocomplete="off" data-i18n-attr="placeholder:adm.buscarPh" placeholder="Buscar clientes, leads, cursos…  ( / )" aria-controls="resultados-globales" aria-expanded="false">
          <div class="resultados-globales" id="resultados-globales" role="listbox" hidden></div>
        </div>
        <div class="barra-acciones">
          <button class="btn-icono btn-idioma-app" type="button" data-cambiar-idioma>EN</button>
          <button class="btn-icono" type="button" id="btn-tema" data-i18n-attr="aria-label:tema.cambiar" aria-label="Cambiar apariencia">
            <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          </button>
        </div>
      </header>
      <main id="vista" class="vistas vistas-admin" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <!-- Cajón lateral (fichas y editores) -->
  <div class="cajon-contenedor" id="cajon-contenedor" hidden>
    <div class="cajon-velo" data-cerrar-cajon></div>
    <aside class="cajon" id="cajon" role="dialog" aria-modal="true" aria-labelledby="cajon-titulo">
      <header class="cajon-cabecera">
        <div>
          <h2 id="cajon-titulo"></h2>
          <p id="cajon-subtitulo" class="texto-suave-app"></p>
        </div>
        <button type="button" class="btn-icono" data-cerrar-cajon data-i18n-attr="aria-label:adm.cerrar" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="cajon-cuerpo" id="cajon-cuerpo"></div>
    </aside>
  </div>

  <!-- Modal genérico -->
  <div class="modal-contenedor" id="modal-contenedor" hidden>
    <div class="cajon-velo" data-cerrar-modal></div>
    <div class="modal panel" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo"></h2>
      <div id="modal-cuerpo"></div>
      <div class="modal-acciones" id="modal-acciones"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
